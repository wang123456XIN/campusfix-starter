<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>CampusFix 校园报修</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    a { color: #1a73e8; text-decoration: none; }
    .ticket { border: 1px solid #ddd; border-radius: 8px; padding: 0.6rem 1rem; margin-bottom: 0.5rem; }
    .ticket .title { font-weight: 600; }
    .ticket .meta { color: #666; font-size: 0.85rem; margin-top: 0.2rem; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.75rem; background: #e8f0fe; color: #1a73e8; }
  </style>
</head>
<body>
  <h1>CampusFix 校园报修（第4组）</h1>
  <p><a href="{{ url_for('create_ticket') }}">+ 新建工单</a></p>
  {% if tickets %}
    {% for t in tickets %}
      <div class="ticket">
        <div class="title"><a href="{{ url_for('ticket_detail', ticket_id=t['id']) }}">{{ t['title'] }}</a></div>
        <div class="meta">位置：{{ t['room'] }} · 状态：<span class="badge">{{ t['status'] }}</span> · {{ t['created_at'] }}</div>
      </div>
    {% endfor %}
  {% else %}
    <p>暂无工单。</p>
  {% endif %}
</body>
</html>
